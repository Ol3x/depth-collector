[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-collector"
version = "0.1.0"
description = "Dataset download, extraction, and processing CLI for monocular depth collection."
requires-python = ">=3.12"

[project.scripts]
dc = "depth_collector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
